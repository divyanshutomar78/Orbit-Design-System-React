<label [class]="classes">
  <input
    type="radio"
    [id]="id"
    class="orbit-option-radio__input"
    [checked]="isSelected"
    [disabled]="isDisabled"
    [name]="name"
    [value]="value"
    (change)="onChange($event)"
  />
  <orbit-icon-frame [size]="iconSize" [className]="'orbit-option-radio__icon'">
    <orbit-option-radio-icon [selected]="isSelected"></orbit-option-radio-icon>
  </orbit-icon-frame>
  <span class="orbit-option-radio__text">
    <ng-container *ngIf="useTextSlot; else radioLabelTpl">
      <ng-content select="[orbitTextSlot]"></ng-content>
    </ng-container>
    <ng-template #radioLabelTpl>
      <span class="orbit-option-radio__label">{{ label }}</span>
    </ng-template>
  </span>
</label>
